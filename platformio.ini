[platformio]
default_envs = x4c
build_cache_dir = .cache

[yomu]
version = 0.1.0

[base]
extra_scripts = pre:tools/pio_inc.py
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=missingInclude --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -DCROSSPOINT_EMULATED=0
  -DUSE_UTF8_LONG_NAMES=1
  ; SdFat: 512-byte SPI.transfer() instead of per-byte (not GDMA).
  -DUSE_SPI_ARRAY_TRANSFER=1
  ; WebServer raw-upload read size. Must stay small: `new HTTPRaw()` is thrown
  ; (abort with -fno-exceptions) if the heap cannot fit the buffer.
  -DHTTP_RAW_BUFLEN=4096
  ; Shared typesetter glyph cap. 2048 runs abort operator new on this heap.
  -DTS_MAX_GLYPHS=256
  -std=gnu++2a
  -Wno-bidi-chars
  ; tjpgd and pngle live in the FreeInk tree. Do not copy them. pngle's miniz is lib/Miniz.
  -I$PROJECT_DIR/freeink-sdk/libs/book/FreeInkBook/third_party/tjpgd
  -I$PROJECT_DIR/freeink-sdk/libs/book/FreeInkBook/third_party/pngle
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

custom_sdkconfig =
  CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
  CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2560
  CONFIG_ESP_WIFI_IRAM_OPT=n
  CONFIG_ESP_WIFI_RX_IRAM_OPT=n
  CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
  CONFIG_ARDUINO_SELECTIVE_RainMaker=n
  CONFIG_ARDUINO_SELECTIVE_Insights=n
  CONFIG_ARDUINO_SELECTIVE_ESP_SR=n
  ; File transfer: default TCP window is 4*MSS (~5.7 KB). 32*MSS + matching
  ; recvmbox; Wi-Fi BA window 12 (static RX must be >= BA_WIN).
  CONFIG_LWIP_TCP_WND_DEFAULT=45952
  CONFIG_LWIP_TCP_SND_BUF_DEFAULT=45952
  CONFIG_LWIP_TCP_RECVMBOX_SIZE=36
  CONFIG_ESP_WIFI_RX_BA_WIN=12
  CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=12
  CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=48

custom_component_remove =
  espressif/esp_insights
  espressif/esp_rainmaker
  espressif/esp_diagnostics
  espressif/esp_diag_data_store
  espressif/esp_schedule
  espressif/esp_rcp_update
  espressif/esp_secure_cert_mgr
  espressif/cbor

; EInkDisplay is vendored in lib/EInkDisplay (not the freeink-sdk submodule).
; SDCardManager is vendored in lib/SDCardManager (freeBytes, recoverCard, SDMMC).
; FreeInkFont rasterizes TrueType on the device. Do not edit the submodule copy.
lib_deps =
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  Imu=symlink://freeink-sdk/libs/hardware/Imu
  FreeInkFont=symlink://freeink-sdk/libs/font/FreeInkFont
  typeset=symlink://../typeset

lib_ignore =
  BLE

; X4 Classic only: ESP32-S3, 16 MB flash, 8 MB octal PSRAM, 1-bit SDMMC.
; `pio run` builds env:x4c. CROSSPOINT_EMULATED is still read by lib/hal.
;   pio run -e x4c -t upload
[env:x4c]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4CLASSIC=1
  -DBOARD_HAS_PSRAM
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  ; Thin stems need the auto-hinter or a 50%-class ink threshold breaks them up.
  -DFREEINK_FONT_ENABLE_AUTOHINT=1
  -DYOMU_VERSION=\"${yomu.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
